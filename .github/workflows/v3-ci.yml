# CI für easyONBOARDING 3 (Ordner V3.0.0).
# - Statische Prüfungen: Parser, Kodierung, XAML, PSScriptAnalyzer, Secret-/Platzhalter-Scan, Doku, Version
# - Pester (Unit + Integration) unter Windows und Linux; unter Windows zusätzlich echtes Laden der
#   WPF-Oberfläche (ohne Anzeige) und PDF-Erzeugung mit Microsoft Edge
# Actions sind auf Commit-SHAs festgelegt; der Workflow benötigt nur Lesezugriff.

name: V3 CI

on:
  push:
    paths:
      - 'V3.0.0/**'
      - '.github/workflows/v3-ci.yml'
  pull_request:
    paths:
      - 'V3.0.0/**'
      - '.github/workflows/v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POWERSHELL_TELEMETRY_OPTOUT: '1'
  POWERSHELL_UPDATECHECK: 'Off'
  PESTER_VERSION: '5.7.1'
  EOB_PSSA_VERSION: '1.24.0'

defaults:
  run:
    shell: pwsh
    working-directory: V3.0.0

jobs:
  static:
    name: Statische Prüfungen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PSScriptAnalyzer installieren (Benutzerbereich, feste Version)
        run: Install-PSResource -Name PSScriptAnalyzer -Version $env:EOB_PSSA_VERSION -Scope CurrentUser -TrustRepository

      - name: Parser, Kodierung und XAML
        run: ./Scripts/Invoke-EobQualityCheck.ps1 -Check Parser, Encoding, Xaml

      - name: PSScriptAnalyzer
        run: ./Scripts/Invoke-EobQualityCheck.ps1 -Check Analyzer

      - name: Secret- und Platzhalter-Scan
        run: ./Scripts/Invoke-EobQualityCheck.ps1 -Check Secrets

      - name: Dokumentation und Versionsangaben
        run: ./Scripts/Invoke-EobQualityCheck.ps1 -Check Docs, Version

  test:
    name: Pester (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - name: Repository auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pester installieren (Benutzerbereich, feste Version)
        run: Install-PSResource -Name Pester -Version $env:PESTER_VERSION -Scope CurrentUser -TrustRepository

      - name: Pester ausführen
        run: |
          Import-Module -Name Pester -RequiredVersion $env:PESTER_VERSION
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = @('Tests/Unit', 'Tests/Integration')
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputFormat = 'NUnitXml'
          $configuration.TestResult.OutputPath = 'TestResults/pester.xml'
          Invoke-Pester -Configuration $configuration

      - name: Start-easyONBOARDING.ps1 -CheckOnly mit der Beispielkonfiguration
        run: |
          Copy-Item -LiteralPath 'Config/easyONB.ini.template' -Destination 'Config/easyONB.ini'
          ./Start-easyONBOARDING.ps1 -CheckOnly
          if ($LASTEXITCODE -ne 0) { throw "CheckOnly endete mit Exitcode $LASTEXITCODE." }

      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pester-${{ matrix.os }}
          path: V3.0.0/TestResults/pester.xml
          retention-days: 14
          if-no-files-found: warn
