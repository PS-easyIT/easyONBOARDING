; ==============================================================================
; easyONBOARDING - Offboarding-Vorlagen
; ------------------------------------------------------------------------------
; Jede Vorlage ist ein Abschnitt [OffboardingTemplate.<Name>].
; Aktionen werden einer Phase zugeordnet:  Action.<Aktion>=<Phase>
;
;   Immediate      sofort bei der Ausführung
;   ExitDate       zum Austrittsdatum (liegt es in der Vergangenheit: sofort)
;   Retention      Beginn der Aufbewahrungsphase (Austritt + RetentionPhaseStartDays)
;   FinalDeletion  endgültige Löschung (Austritt + RetentionDays; nur DeleteAccount)
;   Off            nicht ausführen
;
; Immer enthalten (nicht abschaltbar): Zustandsbericht vorher/nachher und Abschlussbericht.
; Die endgültige Löschung erfolgt NIE automatisch: sie verlangt RetentionDays > 0, einen
; vorhandenen Snapshot, eine Vorschau und eine Tippbestätigung.
;
; Aktionen: DisableAccount, SetExpiration, DenyLogonHours, UpdateDescription, ResetPassword,
;   ForcePasswordChange, RevokeSessions, RemoveGroups, RemoveLicenseGroups, ClearManager,
;   MoveToOU, HideFromAddressLists, SetAutoReply, SetForwarding, ConvertToSharedMailbox,
;   DocumentMailboxPermissions, ArchiveHomeDirectory, GrantManagerHomeAccess,
;   ClearProfilePath, DeleteAccount
;
; RemoveGroups entfernt NIE: primäre Gruppe, Lizenzgruppen (nur über RemoveLicenseGroups),
; die M365-Synchronisationsgruppe und Gruppen aus KeepGroups.
; Eigene Anpassungen am besten in Config\easyONB.ini vornehmen (hat Vorrang).
; ==============================================================================

[OffboardingTemplate.Standard]
DisplayName=Standardaustritt
Description=Regulärer Austritt: Ablaufdatum sofort, Sperre und Bereinigung zum Austrittsdatum, Postfach und Daten in der Aufbewahrungsphase.
RetentionPhaseStartDays=30
RetentionDays=180
RemoveGroupsMode=AllNonProtected
Action.UpdateDescription=Immediate
Action.SetExpiration=Immediate
Action.DocumentMailboxPermissions=Immediate
Action.DisableAccount=ExitDate
Action.ResetPassword=ExitDate
Action.RevokeSessions=ExitDate
Action.SetAutoReply=ExitDate
Action.HideFromAddressLists=ExitDate
Action.RemoveGroups=ExitDate
Action.MoveToOU=ExitDate
Action.ConvertToSharedMailbox=Retention
Action.RemoveLicenseGroups=Retention
Action.ArchiveHomeDirectory=Retention
Action.ClearProfilePath=Retention
Action.DeleteAccount=FinalDeletion
Action.DenyLogonHours=Off
Action.ForcePasswordChange=Off
Action.ClearManager=Off
Action.SetForwarding=Off
Action.GrantManagerHomeAccess=Off

