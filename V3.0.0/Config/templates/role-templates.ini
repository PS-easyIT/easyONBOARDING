; ==============================================================================
; easyONBOARDING - Rollenvorlagen für das Onboarding
; ------------------------------------------------------------------------------
; [RoleTemplate.<Name>]
;   DisplayName  Anzeigename
;   Groups       Gruppen der Rolle (durch ; getrennt)
;   License      Lizenzschlüssel aus [LicensesGroups]
;   TargetOU     optionale Ziel-OU
;   Title        vorbelegte Position
;   Department   vorbelegte Abteilung
; Privilegierte Gruppen werden auch über Rollenvorlagen niemals zugewiesen.
; Beispielwerte - bitte an die eigene Umgebung anpassen.
; ==============================================================================

[RoleTemplate.Vertrieb]
DisplayName=Vertrieb Innendienst
Description=Standardrolle für den Vertriebsinnendienst.
Groups=GRP-Vertrieb;GRP-VPN-Benutzer
License=MS365_E3
Department=Vertrieb
Title=Vertriebsmitarbeiter/in

[RoleTemplate.Buchhaltung]
DisplayName=Buchhaltung
Description=Standardrolle für die Finanzbuchhaltung.
Groups=GRP-Buchhaltung
License=MS365_E3
Department=Finanzen

[RoleTemplate.IT]
DisplayName=IT-Service (ohne Administratorrechte)
Description=Standardkonto für IT-Mitarbeitende. Administrative Rechte werden separat über Admin-Konten vergeben.
Groups=GRP-IT;GRP-VPN-Benutzer
License=MS365_E5
Department=IT
